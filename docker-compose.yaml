services:
  # -------------------------
  # MONGODB (Alpine)
  # -------------------------
  mongodb:
    image: mongo:7.0-jammy # Alpine variant is deprecated; this is the smallest stable tag
    container_name: mongodb
    restart: always
    ports:
      - '27018:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # POSTGRESQL (Alpine)
  # -------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123

  fusionauth:
    image: fusionauth/fusionauth-app:latest
    container_name: fusionauth
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5433/fusionAuth
      DATABASE_ROOT_USER: fusionauth
      DATABASE_ROOT_PASSWORD: fusionauth
      FUSIONAUTH_APP_MEMORY: 1024M
    ports:
      - '9011:9011'
    links:
      - postgres

# -------------------------
# VOLUMES
# -------------------------
volumes:
  mongo_data:
  postgres_data:
